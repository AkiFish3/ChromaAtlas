plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// 本工程不引第三方 maven，全部走 Fabric + Central
}

// 本分支是单工程（照 RedtaleEconomy 的 1.20.1-fabric 布局）：
// core（平台无关纯 Java）已在 src/main/java/com/akira/chromaatlas/core/，
// 不再通过跨工程的 java.srcDir 引外部目录。

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

loom {
	runs {
		client {
			name "ChromaAtlas Client"
			client()
			runDir "run/client"
		}
		server {
			name "ChromaAtlas Server"
			server()
			runDir "run/server"
		}
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"loader_version": project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

// core 自检（不用 JUnit，靠退出码）⇒ ./gradlew selfTest
tasks.register('selfTest', JavaExec) {
	group = 'verification'
	description = '跑 core 自检 SelfTest'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.akira.chromaatlas.core.SelfTest'
}
