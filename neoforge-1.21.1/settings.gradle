pluginManagement {
	repositories {
		// ★顺序有意义★ maven.neoforged.net 在本机不稳（HEAD 直接超时），放前面会把整个构建挂住；
		// 插件本身在 central + architectury 都能拿到，neoforge 构件只需在项目仓库里解析（且已缓存）。
		mavenCentral()
		maven { url = 'https://maven.fabricmc.net/' }
		maven { url = 'https://maven.architectury.dev/' }
		// architectury-loom 的传递依赖里有历史 forge 构件（installertools / mcinjector / DiffPatch），
		// 只在 forge maven 上，central 与 architectury 都没有
		maven { url = 'https://maven.minecraftforge.net/' }
		gradlePluginPortal()
	}
}

rootProject.name = 'chromaatlas-1.21.1-neoforge'
