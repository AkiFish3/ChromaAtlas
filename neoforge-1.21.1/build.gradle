plugins {
	id 'dev.architectury.loom' version '1.11-SNAPSHOT'
	id 'architectury-plugin' version '3.4-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// ★maven.neoforged.net 在本机 TLS 层直接超时（10s 无响应）★，ForgeCDN 同内容可用
	maven { url = 'https://neoforged.forgecdn.net/releases' }
	maven { url = 'https://maven.neoforged.net/releases' }
	mavenCentral()
}

sourceSets {
	main {
		// core 与平台无关，直接并进主 source set（三壳共用同一份）
		java.srcDir '../core/src/main/java'
	}
}

architectury {
	minecraft = project.minecraft_version
	platformSetupLoomIde()
	neoForge()
}

loom {
	silentMojangMappingsLicense()
	// ★必须显式打开 neoforge 平台★：LoomConfigurations 用 isNeoForge() 决定是否创建
	// "neoForge" 解析配置与整套 classpath 接线；architectury 的 neoForge() 在 afterEvaluate
	// 才生效，赶不上配置期 ⇒ 首轮出现「net.neoforged.* 全部不存在」。
	neoForge { }
	// 不配 mixin{}：设了它会要求 useLegacyMixinAp=true（旧 Mixin AP）。
	// NeoForge 1.20.2+ 由 FML 在运行时重映射 mixin 配置，不需要 refmap 注解处理器。
	runs {
		server {
			name "ChromaAtlas Server"
			server()
			runDir "run/server"
		}
		client {
			name "ChromaAtlas Client"
			client()
			runDir "run/client"
		}
	}
}

dependencies {
	minecraft "net.minecraft:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	neoForge "net.neoforged:neoforge:${project.neoforge_version}"
}

processResources {
	inputs.property "version", project.version
	filteringCharset "UTF-8"
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
